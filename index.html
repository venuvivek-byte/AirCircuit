<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Electronics Simulator</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
      #video {
        position: fixed; inset: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1); /* mirror */
      }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #status {
        position: fixed; top: 12px; right: 12px; min-width: 180px;
        padding: 10px 12px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.6); color: #e6e6e6; font-size: 13px; line-height: 1.5;
        pointer-events: none;
      }
      #status .err { color: #ff7b7b; }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="scene"></canvas>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
