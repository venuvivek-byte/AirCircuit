<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirCircuit</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
      #video {
        position: fixed; inset: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1); /* mirror */
      }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #skeleton { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #right {
        position: fixed; top: 12px; right: 12px; width: 280px;
        display: flex; flex-direction: column; gap: 8px; pointer-events: none;
      }
      #status, #messages {
        padding: 10px 12px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.6); color: #e6e6e6; font-size: 13px; line-height: 1.5;
      }
      #status .err { color: #ff7b7b; }
      #messages h3 { margin: 0 0 6px; font-size: 13px; color: #aaa; font-weight: 600; }
      #messages .msg { padding: 6px 8px; margin-top: 4px; border-radius: 5px; border-left: 4px solid; }
      #messages .error { border-color: #ff4d4d; background: rgba(255, 60, 60, 0.15); }
      #messages .warning { border-color: #ffb020; background: rgba(255, 176, 32, 0.15); }
      #messages .ok { border-color: #3ddc84; background: rgba(61, 220, 132, 0.15); }
      #messages .hint { color: #bbb; font-style: italic; }
      #toolbar {
        position: fixed; top: 12px; left: 12px; bottom: 112px; display: flex; flex-direction: column; flex-wrap: wrap;
        align-content: flex-start; gap: 6px;
      }
      #toolbar button {
        min-width: 140px; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
        background: rgba(20, 20, 30, 0.7); color: #fff; font-size: 14px; text-align: left; cursor: pointer;
      }
      #toolbar button:hover, #toolbar button.hand-hover { background-color: rgba(60, 130, 255, 0.75); }
      /* Hand-mode dwell: the button fills up while the fingertip rests on it. */
      #toolbar button {
        position: relative;
        background-image: linear-gradient(to right, rgba(61, 220, 132, 0.8) calc(var(--dwell, 0) * 100%), transparent 0);
      }
      #toolbar button[data-dwell]::after {
        content: attr(data-dwell); position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        font-size: 12px; font-weight: 600; color: #fff;
      }
      #tooltip {
        position: fixed; left: 0; top: 0; display: none; pointer-events: none;
        padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.8); color: #ffe27a; font-size: 13px;
      }
      body.mouse-mode #scene { cursor: crosshair; }
      #trash {
        position: fixed; left: 12px; bottom: 12px; width: 140px; height: 90px;
        display: flex; align-items: center; justify-content: center; text-align: center;
        border: 2px dashed rgba(255,120,120,0.7); border-radius: 10px;
        background: rgba(60, 0, 0, 0.45); color: #ffb3b3; font-size: 13px; pointer-events: none;
      }
      #hint {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 70vw;
        padding: 10px 16px; border-radius: 22px; pointer-events: none; text-align: center;
        background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 15px;
      }
      #hint.warn { background: rgba(140, 40, 0, 0.8); }
      #sensors {
        padding: 10px 12px; border-radius: 8px; pointer-events: auto;
        background: rgba(0, 0, 0, 0.6); color: #e6e6e6; font-size: 13px; line-height: 1.5;
      }
      #sensors h3 { margin: 0 0 6px; font-size: 13px; color: #aaa; font-weight: 600; }
      #sensors .sens-row.off { color: #ff9a7a; }
      #sensors .sens-bar { letter-spacing: -2px; color: #7ad0ff; }
      #sensors .sens-ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      #sensors input[type=range] { flex: 1; }
      #sensors button, #code button {
        padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px;
        background: rgba(40, 40, 55, 0.9); color: #fff; font-size: 12px; cursor: pointer; position: relative;
        background-image: linear-gradient(to right, rgba(61, 220, 132, 0.8) calc(var(--dwell, 0) * 100%), transparent 0);
      }
      #sensors button:hover, #code button:hover, #sensors button.hand-hover, #code button.hand-hover { background-color: rgba(60, 130, 255, 0.75); }
      #sensors .hint { color: #bbb; font-size: 12px; margin-top: 6px; }

      #code {
        position: fixed; top: 12px; right: 304px; width: min(520px, calc(100vw - 500px)); bottom: 70px;
        display: none; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px;
        background: rgba(12, 14, 20, 0.92); color: #e6e6e6; font-size: 13px; z-index: 5;
      }
      #code.open { display: flex; }
      #code .code-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #code .code-head .code-close { margin-left: auto; }
      #code .code-boards { display: flex; gap: 4px; flex-wrap: wrap; }
      #code .code-boards button.sel { background-color: rgba(60, 130, 255, 0.9); }
      #code .code-presets { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; color: #aaa; }
      #code .code-edit { flex: 1; min-height: 120px; display: flex; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
      #code .code-gutter, #code textarea {
        margin: 0; padding: 8px 6px; font: 13px/1.45 ui-monospace, Consolas, monospace; border: 0;
      }
      #code .code-gutter { width: 2.6em; text-align: right; color: #666; background: #0b0d12; overflow: hidden; user-select: none; }
      #code textarea { flex: 1; resize: none; outline: none; background: #11141b; color: #e8e8e8; tab-size: 2; white-space: pre; }
      #code .code-actions { display: flex; align-items: center; gap: 8px; }
      #code .code-upload { font-weight: 600; background-color: rgba(30, 120, 70, 0.95); }
      #code .code-upload:disabled { opacity: 0.5; }
      #code .code-progress { width: 110px; height: 8px; border-radius: 4px; background: #222; overflow: hidden; }
      #code .code-progress > div { height: 100%; width: 0; background: #3ddc84; transition: width 0.08s linear; }
      #code .code-status.ok { color: #3ddc84; }
      #code .code-status.err { color: #ff7b7b; }
      #code .code-errors { display: flex; flex-direction: column; gap: 3px; }
      #code .code-error { text-align: left; color: #ffb3b3; border-color: rgba(255, 80, 80, 0.5) !important; font-family: ui-monospace, Consolas, monospace; }
      #code .code-serial-head { display: flex; justify-content: space-between; align-items: center; color: #aaa; }
      #code .code-serial {
        height: 22%; min-height: 70px; margin: 0; padding: 6px 8px; overflow: auto; border-radius: 6px;
        background: #000; color: #9cff9c; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap;
      }
      #code .code-hint { color: #888; font-size: 11px; }
      #trash.active { background: rgba(200, 30, 30, 0.7); color: #fff; }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="scene"></canvas>
    <canvas id="skeleton"></canvas>
    <div id="toolbar"></div>
    <div id="right">
      <div id="status"></div>
      <div id="messages"></div>
      <div id="sensors"></div>
    </div>
    <div id="code"></div>
    <div id="tooltip"></div>
    <div id="hint"></div>
    <div id="trash">🗑 Drop here<br>to delete</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
